{% extends "layout.html" %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
            <h4>Approve Asset Request</h4>
        </div>

        <div class="card-body">
            <form method="POST">
                <label>Asset Available Location</label>
                <input name="approved_location" class="form-control" required>

                <label class="mt-3">HR Contact Number</label>
                <input name="contact" class="form-control" required>

                <button class="btn btn-success w-100 mt-4">
                    Confirm & Send Email
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
